# =============================================================================
# Intelligent Relation Analyzer - Logging Configuration
# =============================================================================

# Root logger level (SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST)
.level=INFO

# Handlers - both console and file
handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler

# =============================================================================
# Console Handler Configuration
# =============================================================================
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=org.example.logging.AppFormatter

# =============================================================================
# File Handler Configuration
# =============================================================================
# Log file pattern (%g = generation number for rotation)
java.util.logging.FileHandler.pattern=logs/app_%g.log

# Maximum file size before rotation (5MB = 5242880 bytes)
java.util.logging.FileHandler.limit=5242880

# Number of rotated files to keep
java.util.logging.FileHandler.count=10

# Append to existing file
java.util.logging.FileHandler.append=true

# Custom formatter
java.util.logging.FileHandler.formatter=org.example.logging.AppFormatter

# =============================================================================
# Package-specific Logging Levels
# =============================================================================
# Service layer
org.example.service.level=INFO

# ML layer
org.example.ml.level=INFO

# Analyzer layer  
org.example.analyzer.level=INFO

# UI layer
org.example.ui.level=INFO

# Logging infrastructure
org.example.logging.level=INFO

# =============================================================================
# Development Mode (uncomment for verbose logging)
# =============================================================================
# .level=FINE
# org.example.level=FINE
# java.util.logging.ConsoleHandler.level=FINE
