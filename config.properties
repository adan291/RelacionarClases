#Configuración del usuario - Intelligent Relation Analyzer
#Mon Dec 01 12:13:57 CET 2025
last.path=D\:\\RelacionarClases\\src\\main\\java\\org\\example\\ejemplos
theme=dark
window.height=689.0
window.width=966.0
window.x=100.0
window.y=100.0

# ============================================
# ML Configuration
# ============================================
# Minimum decisions required for ML to be available
ml.minDecisions=10

# Score combination weights (must sum to 1.0)
ml.weight.ml=0.5
ml.weight.structural=0.3
ml.weight.semantic=0.2

# Logistic regression training parameters
ml.learningRate=0.01
ml.maxIterations=1000

# ============================================
# Analysis Configuration
# ============================================
# Default confidence threshold for filtering (0.0-1.0)
analysis.defaultConfidenceThreshold=0.0

# High confidence threshold for smart selection (0.0-1.0)
analysis.highConfidenceThreshold=0.8

# Paths to ignore during analysis (comma-separated)
analysis.ignoredPaths=target,build,.git,node_modules

# File extensions to analyze (comma-separated)
analysis.fileExtensions=.java

# ============================================
# UI Configuration
# ============================================
# Number of selections before requiring confirmation
ui.bulkActionConfirmationThreshold=5

# Default window dimensions (overridden by saved state)
ui.windowWidth=1200
ui.windowHeight=750

# Default theme (light/dark)
ui.defaultTheme=light

# ============================================
# Persistence Configuration
# ============================================
# Path to memory/decisions file
persistence.memoryFilePath=memoria_relaciones.json

# Directory for analysis snapshots
persistence.snapshotsDirectory=snapshots

# Path to trained ML model
persistence.modelFilePath=model.json

# Path to training data directory
persistence.trainingDataPath=training_data
