# Test Configuration - Intelligent Relation Analyzer
# This configuration is used for integration tests

# ============================================
# ML Configuration (Test Values)
# ============================================
# Lower threshold for faster test execution
ml.minDecisions=5

# Score combination weights (must sum to 1.0)
ml.weight.ml=0.5
ml.weight.structural=0.3
ml.weight.semantic=0.2

# Faster training for tests
ml.learningRate=0.1
ml.maxIterations=100

# ============================================
# Analysis Configuration (Test Values)
# ============================================
# Default confidence threshold for filtering (0.0-1.0)
analysis.defaultConfidenceThreshold=0.0

# High confidence threshold for smart selection (0.0-1.0)
analysis.highConfidenceThreshold=0.7

# Paths to ignore during analysis (comma-separated)
analysis.ignoredPaths=target,build,.git,node_modules

# File extensions to analyze (comma-separated)
analysis.fileExtensions=.java

# ============================================
# UI Configuration (Test Values)
# ============================================
# Lower threshold for test scenarios
ui.bulkActionConfirmationThreshold=3

# Test window dimensions
ui.windowWidth=800
ui.windowHeight=600

# Default theme for tests
ui.defaultTheme=light

# ============================================
# Persistence Configuration (Test Values)
# ============================================
# These paths will be overridden by @TempDir in tests
persistence.memoryFilePath=test-memory.json
persistence.snapshotsDirectory=test-snapshots
persistence.modelFilePath=test-model.json
persistence.trainingDataPath=test-training-data
